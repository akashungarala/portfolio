workProjects:
  - id: ngmm
    title: NGMM
    fullName: Next Generation Maintenance Management
    company: Marathon
    logo: /assets/logos/marathon.jpeg
    website: https://www.marathonpetroleum.com
    description: |
      AI-powered refinery maintenance assistant combining multi-agent
      orchestration, SQL retrieval, and work-order planning for operational
      decision support.
    longDescription: |
      Challenge: Refinery maintenance engineers spent hours manually reconciling
      work orders, equipment records, and operational notifications before they
      could diagnose an issue. Generic LLM tooling was unusable here — answers
      had to be grounded in real maintenance data, not generated.

      Solution: Built a multi-agent system on Python/FastAPI and Semantic Kernel
      where specialized agents — SQL retrieval, planner, graph, and notification
      — work under a coordinating manager. SQL retrieval and validation layers
      narrow to relevant operational data before the model reasons over it.
      Cosmos DB persistence with turn reconstruction and tool-call rehydration
      keeps long investigations coherent across sessions.

      Impact: Cut manual investigation time by 30-40% and analyst research effort
      by 50%. OpenTelemetry and Azure Monitor instrumentation reduced issue
      diagnosis time by 35%, and Azure AD with RBAC made the platform safe for
      enterprise operational use.
    techStack: [Python, FastAPI, Semantic Kernel, Azure AD, Cosmos DB, OpenTelemetry, Azure Monitor, Chainlit, TypeScript]
    featured: true
    metrics:
      - 30-40% reduction in manual investigation time
      - 50% reduction in analyst research effort
      - 90% improvement in session continuity

  - id: mara-terra
    title: Mara-Terra
    company: Marathon
    logo: /assets/logos/marathon.jpeg
    website: https://www.marathonpetroleum.com
    description: |
      MCP server exposing internal Terraform and pipeline module knowledge to
      AI assistants through Azure AI Search.
    longDescription: |
      Challenge: Engineers had hundreds of internal Terraform and pipeline
      modules spread across sprawling repos and documentation. Finding the right
      module meant asking someone who already knew — tribal knowledge as a
      dependency.

      Solution: Built an MCP (Model Context Protocol) server from scratch in
      Python and FastMCP, backed by Azure AI Search indices for Terraform
      modules, pipeline modules, and documentation. Domain-specific providers
      expose read-only, idempotent tool contracts over both stdio and HTTP, so
      any MCP-compatible AI client can query internal infrastructure knowledge
      directly. Dual-credential identity — Azure CLI locally, managed identity
      in cloud — with OData sanitization, bounded results, and retry logic.

      Impact: Turned undocumented infrastructure knowledge into a searchable
      surface that AI assistants can reach, removing the manual hunt through
      module repos and the dependency on tribal knowledge.
    techStack: [Python, FastMCP, Azure AI Search, Azure Identity, MCP, Managed Identity, Azure App Service]
    featured: true
    metrics:
      - 7 read-only tools exposed to any MCP-compatible AI client
      - Hundreds of Terraform and pipeline modules made searchable
      - Built and shipped from scratch in 2 months

  - id: caption-exchange
    title: CaptionExchange
    company: Fox
    logo: /assets/logos/fox.jpeg
    website: https://www.foxcorporation.com
    description: |
      Real-time AI/human captioning platform with sub-5-second failover
      serving 8M+ concurrent broadcast viewers.
    longDescription: |
      Challenge: Fox's live broadcasts needed seamless captioning with instant
      failover between AI and human captioners — existing solutions had 3+ minute
      recovery times, unacceptable for live TV.
      
      Solution: Architected 9 microservices handling real-time audio transport,
      caption routing, and WebSocket-based session control. Built predictive
      routing that detects failures before they impact viewers.
      
      Impact: Reduced failover from 3 minutes to under 5 seconds. Platform now
      serves 8M+ concurrent viewers with sub-100ms p99 latency across 10K+
      simultaneous connections.
    techStack: [Python, FastAPI, TypeScript, Express.js, WebSockets, Kubernetes, Helm]
    featured: true
    metrics:
      - 8M+ concurrent viewers served
      - Sub-5-second failover (down from 3 minutes)
      - 10K+ simultaneous WebSocket connections

  - id: slo-tracker
    title: SLO Tracker
    company: Fidelity
    logo: /assets/logos/fidelity.jpeg
    website: https://www.fidelity.com
    description: |
      Centralized observability platform reducing Mean Time to Detection
      by 40% across 50+ engineering teams.
    longDescription: |
      Challenge: Fidelity's 500+ microservices lacked unified reliability metrics.
      Teams couldn't track SLOs consistently, leading to slow incident detection
      and alert fatigue.

      Solution: Built end-to-end SLO platform with alerts-as-code, error budget
      tracking, and automated breach notifications. Integrated OpenTelemetry
      across all services with a React dashboard for visibility.

      Impact: Reduced Mean Time to Detection by 40% across 50+ teams. High-cardinality
      metrics POC cut alert noise by 50%, saving 20 engineering hours weekly.
    techStack: [Python, FastAPI, AWS Lambda, PostgreSQL, React, TypeScript, Terraform, OpenTelemetry]
    featured: true
    metrics:
      - 40% reduction in Mean Time to Detection
      - 50+ engineering teams onboarded
      - 20 engineering hours/week saved in alert triage

