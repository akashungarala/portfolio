about:
  heading: Systems that scale when it matters most
  intro: |
    10+ years building backend systems where failure isn't an option. Real-time
    broadcast captioning for 8M+ viewers. Ad platforms processing 2B+ daily events.
    Observability tools trusted by 50+ engineering teams. I design systems where
    uptime and throughput are non-negotiable.
  philosophy: |
    Great backend systems are invisible: fast, consistent, resilient under load.
    I combine Python's expressiveness with TypeScript's type safety to build
    services teams can maintain and scale. I own problems end-to-end — architecture,
    deployment, and on-call.
  currentFocus: |
    Most recently built NGMM at Marathon Petroleum — a multi-agent AI assistant
    that grounds LLM reasoning in refinery maintenance data, with the Azure AD
    auth, session persistence, and OpenTelemetry tracing it takes to survive
    production. Same discipline as the broadcast and fintech work, pointed at a
    newer problem.
  coreValues:
